<style>
:root{--bg:#eef0ea;--paper:#fbfcf8;--ink:#1b2130;--muted:#5d6577;--line:#d5d9cf;--stamp:#c23a2b;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#12151d;--paper:#1b2030;--ink:#e8eaf1;--muted:#9aa1b4;--line:#2e3547;--stamp:#ff7a66;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
main{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-block:40px}
.logo{width:96px;height:auto;border-radius:22%;box-shadow:0 0 0 1px var(--line)}
h1{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;margin:0;letter-spacing:-.02em}
h1 span{color:var(--stamp)}
p{margin:0;color:var(--muted)}
.go{display:block;width:100%;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:600;font-size:1.05rem;padding:15px 20px;border-radius:10px}
.go:focus-visible{outline:2px solid var(--stamp);outline-offset:3px}
.dica{font-size:.88rem;border:1.5px dashed var(--line);border-radius:10px;padding:12px 14px;background:var(--paper)}
.dica b{color:var(--ink)}
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#1b2130"/><g transform="rotate(-12 256 256)"><path fill="#fbfcf8" d="M96 156h320a20 20 0 0 1 20 20v52a28 28 0 0 0 0 56v52a20 20 0 0 1-20 20H96a20 20 0 0 1-20-20v-52a28 28 0 0 0 0-56v-52a20 20 0 0 1 20-20z"/><line x1="186" y1="176" x2="186" y2="336" stroke="#c4c9bd" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 20"/><g fill="#c23a2b"><circle cx="270" cy="210" r="30"/><circle cx="366" cy="302" r="30"/><rect x="306" y="166" width="22" height="180" rx="11" transform="rotate(38 318 256)"/></g><circle cx="270" cy="210" r="12" fill="#fbfcf8"/><circle cx="366" cy="302" r="12" fill="#fbfcf8"/><rect x="114" y="226" width="44" height="12" rx="6" fill="#2f3fa0"/><rect x="114" y="250" width="30" height="12" rx="6" fill="#2f3fa0" opacity=".55"/></g></svg>
  <h1>Cupom <span>do Dia</span></h1>
  <p>Cupons de AliExpress, Mercado Livre, Shopee e Amazon, atualizados a cada 3 horas.</p>
  <a class="go" href="https://claude.ai/artifact/QZFC3qJEpP2kDVktxdPvFC">Ver cupons de hoje</a>
  <p class="dica">No iPhone: toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>. O ícone abre os cupons direto.</p>
</main>
</body>
</html>
