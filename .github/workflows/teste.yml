name: teste-leitura-artifact
on: [push, workflow_dispatch]
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: Ler arquivos publicados
        run: |
          H="https://bec2bc2a-8efe-4c9d-ae4f-cb32a401e0fb.frame.claudeusercontent.com"
          A="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          for p in /coupons.json / /index.html; do
            echo "===== $p"
            curl -sS -A "$A" -H "Referer: https://claude.ai/" -D - -o b.txt -w "status=%{http_code} type=%{content_type} final=%{url_effective}\n" "$H$p" | grep -iE '^(HTTP|status=|content-type|location|cache-control|access-control)' || true
            head -c 400 b.txt; echo
          done
